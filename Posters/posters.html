<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posters</title>
    <link rel="stylesheet" href="./posters.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <a href="../index.html" class="logo">
           Anastasia Eliseeva
           </a>
        </div>
    </header>
    
  <div class="page">
 
    <div class="intro">
      <h1 class="project-title">Posters</h1>
    </div>

    <div class="poster-grid">
      <div class="poster-row">
        <img src="./img_posters/poster-fiin.jpg" alt="Pink letterform poster">
        <img src="./img_posters/Mus_club.jpg" alt="Music club poster">
        <img src="./img_posters/19june_Mader_nort_print.jpg" alt="Mader Nort 19 June print poster">
      </div>

      <div class="poster-row">
        <img src="./img_posters/barocco-hand.jpg" alt="Barocco poster held against the sky">
        <img src="./img_posters/Discuss_club_barocco_01.jpg" alt="Barocco discussion club poster">
        <img src="./img_posters/Intellectual_club_02.jpg" alt="Intellectual club poster">
      </div>

      <div class="poster-row">
        <img src="./img_posters/Poster_kraeved.jpg" alt="Local history festival poster">
        <img src="./img_posters/IMG_34790.jpg" alt="Person holding the local history festival poster">
        <img src="./img_posters/Poster_kraeved_print_02.jpg" alt="Local history festival map poster">
      </div>

      <div class="poster-row poster-row--wide-right">
        <img src="./img_posters/Marshrut_staruhi_poster_Legenda_preview.jpg" alt="Marshrut Staruhi poster">
        <img src="./img_posters/M80A6895.jpg" alt="Visitor looking at posters on a light wall">
      </div>

      <div class="poster-row">
        <img src="./img_posters/Poster_kraeved_fest_01.jpg" alt="Local history festival poster, grey version">
        <img src="./img_posters/poster_kraeved_10.jpg" alt="Local history festival notebook poster">
        <img src="./img_posters/Poster_kraeved_fest_03.jpg" alt="Local history festival poster, brown version">
      </div>

      <div class="poster-row">
        <img src="./img_posters/dw work poster.webp" alt="Master Fill Text poster">
        <img src="./img_posters/posters_japan_new02.jpg" alt="Die in a Japanese garden poster">
        <img src="./img_posters/Mus_club_03.jpg" alt="Music club poster, muted version">
      </div>

      <div class="poster-row">
        <img src="./img_posters/25-june_Goribol-Tarivedriev.jpg" alt="Alexey Goribol Tariverdiev concert poster">
        <img src="./img_posters/Poster_Batagov_Feldman_print_pic.jpg" alt="Anton Batagov Feldman concert poster">
        <img src="./img_posters/V_sosedney_komnate_01.jpg" alt="In the next room it is always quiet poster">
      </div>

      <div class="poster-row poster-row--wide-left">
        <img src="./img_posters/exhivbtion.webp" alt="Exhibition wall of posters">
        <img src="./img_posters/zamusch.webp" alt="Getting married is life-threatening poster">
      </div>

      <div class="poster-row poster-row--embed">
        <img src="./img_posters/19june_Mader_nort_black.jpg" alt="Mader Nort black poster">
        <img src="./img_posters/19june_Mader_nort_red.jpg" alt="Mader Nort red poster">
        <div class="poster-embed">
          <div class="poster-embed__frame">
            <iframe id="poster-vospominania-player" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;" frameborder="0" allowfullscreen></iframe>
          </div>
          <button type="button" class="poster-embed__volume" aria-label="Mute" aria-pressed="false">
            <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.6 2.2 2.2-2.2 1.4 1.4-2.2 2.2 2.2 2.2-1.4 1.4-2.2-2.2-2.2 2.2-1.4-1.4 2.2-2.2-2.2-2.2 1.4-1.4 2.2 2.2z"/></svg>
          </button>
        </div>
      </div>

      <div class="poster-row">
        <img src="./img_posters/nothing_changed.jpg" alt="Nothing happened if you draw a line poster">
        <img src="./img_posters/poster_black-34.jpg" alt="Origins of Bach poster">
        <img src="./img_posters/sigarettes.jpg" alt="Cigarettes are not toys poster">
      </div>

      <div class="poster-row poster-row--black">
        <img src="./img_posters/interface1-01.jpg" alt="Ten rules of interface typography, cover">
        <img src="./img_posters/interface1-02.jpg" alt="Ten rules of interface typography, rules 1 to 4">
        <img src="./img_posters/interface1-03-03.jpg" alt="Ten rules of interface typography, rules 5 to 10">
      </div>
    </div>
 
    <footer class="site-footer">
      <button type="button" class="site-footer__link" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">to the top</button>
      <a class="site-footer__link" href="../index.html">back to works</a>
    </footer>
 
  </div>

  <script>
    function onKinescopeIframeAPIReady(playerFactory) {
      var volumeButton = document.querySelector('.poster-embed__volume');

      playerFactory.create('poster-vospominania-player', {
        url: 'https://kinescope.io/aeoKjpy8orbrF2meayNdmj',
        size: { width: '100%', height: '100%' },
        behavior: {
          autoPlay: 'viewable',
          playback: 'visible',
          playsInline: true
        }
      }).then(function (player) {
        player.setVolume(1);
        player.unmute();

        function paint(muted) {
          volumeButton.classList.toggle('is-muted', muted);
          volumeButton.setAttribute('aria-pressed', muted ? 'true' : 'false');
          volumeButton.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
        }

        volumeButton.addEventListener('click', function () {
          player.isMuted().then(function (muted) {
            if (muted) {
              player.unmute();
              player.setVolume(1);
              paint(false);
            } else {
              player.mute();
              paint(true);
            }
          });
        });
      });
    }

    var kinescopeScript = document.createElement('script');
    kinescopeScript.src = 'https://player.kinescope.io/latest/iframe.player.js';
    document.head.appendChild(kinescopeScript);
  </script>
 
</body>
</html>
